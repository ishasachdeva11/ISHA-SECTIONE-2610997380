<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Course Registration</title>
</head>
<body>
   <form action="registration_form_values.html" target="_blank">
    <label for="name">Student Name</label>
    <input type="text" id="name" required>
    <label for="email">Email Address</label>
    <input type="email" id="email" required>
    <label for="mobile number">Mobile Number</label>
    <input type="number" id="mobile number" maxlength="10" required>
    <label for="age">Age</label>
    <input type="number" id="age" maxlength="3">
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <label>Gender:</label>
    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" required>
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" required>
    <label for="other">Other</label>
    <input type="radio" id="other" name="gender"required></p>
    <P>
    <label>Skills:</label>
    <label for="html">HTML</label>
    <input type="checkbox" name="Skills">
    <label for="CSS">CSS</label>
    <input type="checkbox" name="Skills">
    <label for="JAVA SCRIPT">JAVA SCRIPT</label>
    <input type="checkbox" name="Skills">
    <label for="Python">PYTHON</label>
    <input type="checkbox" name="Skills">
   </P>
   <P>

    <label>Course:</label>
      <select>
        <option>Web Development</option>
        <option>Python Programmming</option>
        <option>Digital Analytics</option>
        <option>Digital Marketing</option>
      </select required>
    </P>
    <P>
      <input type="text" placeholder="Online Course Registration">
    </P>
    <P>
      <label for="dateofbirth">Date of Birth:</label>
      <input type="date" id="dateofbirth">
      <label for="time">Preferred class time:</label>
      <input type="time" id="time">
    </P>
    <p>
      <label for="Address">Address:</label>
      <textarea name="Address" id="Address"></textarea>
    </p>
    <p>
      <label for="file"></label>
      <input type="file" id="file">
    </p>
    <label for="submit"></label>
    <input type="submit" id="submit">
    <label for="reset"></label>
    <input type="reset" id="reset">
    
    
    
    </p>











   </form>
</body>
</html>
