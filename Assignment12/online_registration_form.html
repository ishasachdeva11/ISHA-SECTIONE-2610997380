<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Course Registration</title>
</head>
<body>
   <form action="registration_form_values.html" target="_blank">
    <label for="name">Student Name</label>
    <input type="text" id="name" name="name" required>
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email">
    <label for="mobile number">Mobile Number</label>
    <input type="number" id="mobile number" name="mobile" maxlength="10" required>
    <label for="age">Age</label>
    <input type="number" id="age" name="age" maxlength="3">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <label>Gender:</label>
    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" value="Male" required>
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="Female" >
    <label for="other">Other</label>
    <input type="radio" id="other" name="gender" value="Other"></p>
    <P>
    <label>Skills:</label>
    <label for="html">HTML</label>
    <input type="checkbox" id="html" name="Skills" value="HTML">
    <label for="css">CSS</label>
    <input type="checkbox" id="css" name="Skills" value="CSS">
    <label for="javascript">JAVASCRIPT</label>
    <input type="checkbox" id="javascript" name="Skills" value="JAVASCRIPT">
    <label for="Python">PYTHON</label>
    <input type="checkbox" id="Python" name="Skills" value="PYTHON">
   </P>
   <P>

    <label>Course:</label>
      <select required>
        <option>Web Development</option>
        <option>Python Programmming</option>
        <option>Digital Analytics</option>
        <option>Digital Marketing</option>
      </select>
    </P>
    <P>
      <input type="text" placeholder="Online Course Registration">
    </P>
    <P>
      <label for="dateofbirth">Date of Birth:</label>
      <input type="date" id="dateofbirth">
      <label for="time">Preferred class time:</label>
      <input type="time" id="time">
    </P>
    <p>
      <label for="Address">Address:</label>
      <textarea name="Address" id="Address"></textarea>
    </p>
    <p>
      <label for="file">Upload File:</label>
      <input type="file" id="file" name="file">
    </p>
    <label for="submit"></label>
    <input type="submit" id="submit" value="submit">
    <label for="reset"></label>
    <input type="reset" id="reset" name="reset">
    
    
    
    </p>











   </form>
</body>
</html>
